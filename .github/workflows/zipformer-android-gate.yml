name: Hebrew Zipformer Android Gate

on:
  pull_request:
    paths:
      - "poc/zipformer-gate/**"
      - "scripts/prepare_zipformer_android_runtime.py"
      - ".github/workflows/zipformer-android-gate.yml"
  push:
    branches:
      - "experiment/zipformer-he-android-gate"

permissions:
  contents: read

jobs:
  build-zipformer-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch and verify pinned Android sherpa-onnx runtime (no weights)
        run: python3 scripts/prepare_zipformer_android_runtime.py
      - name: Compile standalone Android Zipformer gate
        run: |
          chmod +x gradlew
          ./gradlew -p poc/zipformer-gate assembleDebug --stacktrace
      - name: Show APK metadata
        run: ls -lh poc/zipformer-gate/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: zipformer-android-gate-unsigned-for-local-device
          path: poc/zipformer-gate/build/outputs/apk/debug/*.apk
          retention-days: 5
