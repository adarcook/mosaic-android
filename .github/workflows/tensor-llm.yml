name: Tensor local LLM gate
on:
  push:
    branches: ["experiment/tensor-local-llm"]
  pull_request:
    paths: ["poc/tensor-llm/**", "scripts/prepare_tensor_llm.py", "scripts/build_tensor_apps.py", "scripts/tests/test_build_tensor_apps.py", ".github/workflows/tensor-llm.yml"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Test host setup and model separation
        run: python3 -m unittest discover -s scripts/tests -p test_build_tensor_apps.py -v
      - name: Prepare runtime, test import and build without model weights
        run: python3 scripts/build_tensor_apps.py --only llm
      - uses: actions/upload-artifact@v4
        with:
          name: mosaic-tensor-local-llm-apk
          path: poc/tensor-llm/build/outputs/apk/debug/*.apk
          if-no-files-found: error
