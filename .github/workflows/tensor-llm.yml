name: Tensor local LLM gate
on:
  push:
    branches: ["experiment/tensor-local-llm"]
  pull_request:
    paths: ["poc/tensor-llm/**", "scripts/prepare_tensor_llm.py", ".github/workflows/tensor-llm.yml"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Prepare pinned Google Tensor LLM dispatch
        run: python3 scripts/prepare_tensor_llm.py
      - name: Test import and build local LLM APK
        run: ./gradlew -p poc/tensor-llm testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: mosaic-tensor-local-llm-apk
          path: poc/tensor-llm/build/outputs/apk/debug/*.apk
          if-no-files-found: error
