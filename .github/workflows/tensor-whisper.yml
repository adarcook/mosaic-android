name: Tensor Whisper gate template
on:
  push:
    branches: ["experiment/tensor-g5-whisper-gate"]
  pull_request:
    paths:
      - "poc/tensor-whisper/**"
      - "scripts/*whisper*"
      - ".github/workflows/tensor-whisper.yml"
      - "docs/tensor-g5-whisper-gate.md"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Python syntax
        run: |
          python3 -m py_compile scripts/prepare_whisper_tiny_litert.py
          python3 -m py_compile scripts/compile_tensor_whisper.py
          python3 -m py_compile scripts/prepare_tensor_whisper_runtime.py
      - name: Fetch pinned public Tensor runtime
        run: python3 scripts/prepare_tensor_whisper_runtime.py
      - name: Build template without private AOT model
        run: ./gradlew -p poc/tensor-whisper assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: tensor-whisper-template-not-for-installation
          path: poc/tensor-whisper/build/outputs/apk/debug/*.apk
          if-no-files-found: error
