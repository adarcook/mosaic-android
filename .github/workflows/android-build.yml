name: Android Build

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compile Database module
        run: ./gradlew :core:database:assembleDebug

      - name: Run Fit unit tests
        run: ./gradlew :feature:fit:testDebugUnitTest

      - name: Compile Photos module
        run: ./gradlew :feature:photos:assembleDebug

      - name: Compile app
        run: ./gradlew :app:assembleDebug

      - name: Run voice tensor math tests
        run: ./gradlew :app:testDebugUnitTest
