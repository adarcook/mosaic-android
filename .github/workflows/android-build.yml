name: Android Build

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compile Database module
        run: ./gradlew :core:database:assembleDebug

      - name: Run Fit unit tests
        run: ./gradlew :feature:fit:testDebugUnitTest

      - name: Compile Photos module
        run: ./gradlew :feature:photos:assembleDebug

      - name: Compile app
        run: ./gradlew :app:assembleDebug

      - name: Test STT model-pack upgrade
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Run voice tensor math tests
        run: ./gradlew :app:testDebugUnitTest

  assemble-vulkan-poc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build optional Vulkan APK
        run: ./gradlew :app:assembleDebug -PvoiceVulkan=true
      - name: Upload experimental APK
        uses: actions/upload-artifact@v4
        with:
          name: voice-poc-vulkan-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
