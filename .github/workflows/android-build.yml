name: Android Build

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Compile Photos module
        run: ./gradlew :feature:photos:assembleDebug

      - name: Compile app
        run: ./gradlew :app:assembleDebug
