name: Hebrew Zipformer preflight (no weights)

on:
  pull_request:
    paths:
      - "scripts/prepare_zipformer_he.py"
      - "scripts/tests/test_prepare_zipformer_he.py"
      - "docs/zipformer-he-preflight.md"
      - ".github/workflows/zipformer-preflight.yml"
  push:
    branches:
      - "experiment/zipformer-he-preflight"

permissions:
  contents: read

jobs:
  offline-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax-check private-model preflight
        run: python -m py_compile scripts/prepare_zipformer_he.py
      - name: Test revision/asset/sha pinning (no models or network)
        run: python -m unittest discover -s scripts/tests -p test_prepare_zipformer_he.py -v
