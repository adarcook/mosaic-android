name: Tensor runtime probe template
on:
  push:
    branches: ["experiment/tensor-g5-probe"]
  pull_request:
    paths: ["poc/tensor-probe/**", "scripts/*tensor*", ".github/workflows/tensor-probe.yml"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch pinned public Android runtime
        run: python3 scripts/prepare_tensor_runtime.py
      - name: Build template (private compiled model is added locally)
        run: ./gradlew -p poc/tensor-probe assembleDebug
      - name: Collect local packaging tools
        run: |
          mkdir -p packaging-tools/lib packaging-tools/lib64
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" packaging-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/aapt" packaging-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" packaging-tools/lib/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib64/libc++.so" packaging-tools/lib64/
      - uses: actions/upload-artifact@v4
        with:
          name: tensor-probe-template-not-for-installation
          path: |
            poc/tensor-probe/build/outputs/apk/debug/*.apk
            packaging-tools/
          if-no-files-found: error
